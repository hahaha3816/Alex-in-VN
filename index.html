<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alex ở Việt Nam — Traffic Survival Guide</title>
  <style>
    :root {
      --paper: #F3E7CC;
      --paper-dark: #E9D9AF;
      --ink: #241C15;
      --lacquer: #C1272D;
      --lacquer-dark: #8f1c21;
      --bamboo: #3F6B4F;
      --bamboo-dark: #2c4d38;
      --gold: #D4A63A;
      --sky: #3E7C97;
      --danger: #E63946;
      --panel-border: 4px solid var(--ink);
      --radius: 14px;
      --shadow: 6px 6px 0 var(--ink);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 8px 8px, rgba(36, 28, 21, 0.06) 1.5px, transparent 1.6px) 0 0/22px 22px,
        var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      color: var(--ink);
      display: flex;
      justify-content: center;
      padding: 24px 14px 60px;
    }

    .stage {
      width: 100%;
      max-width: 640px;
    }

    h1,
    h2,
    h3,
    .display {
      font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif;
    }

    /* ---------- top bar / progress ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .brand {
      font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--lacquer);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: .5px;
    }

    .brand .flag {
      font-size: 1.3rem;
    }

    .notebook {
      display: flex;
      gap: 6px;
    }

    .notebook .page {
      width: 22px;
      height: 26px;
      border: 2.5px solid var(--ink);
      border-radius: 3px;
      background: var(--paper-dark);
      position: relative;
    }

    .notebook .page.filled {
      background: var(--gold);
    }

    .notebook .page.filled::after {
      content: "✓";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .7rem;
      font-weight: 800;
      color: var(--ink);
    }

    /* ---------- comic panel ---------- */
    .panel {
      background: var(--paper);
      border: var(--panel-border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 18px;
      position: relative;
    }

    .panel-header {
      background: var(--ink);
      color: var(--paper);
      padding: 9px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif;
      font-weight: 700;
      font-size: .85rem;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .panel-header .lv {
      color: var(--gold);
    }

    .scene {
      height: 190px;
      position: relative;
      overflow: hidden;
      border-bottom: 3px solid var(--ink);
    }

    .scene svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ---------- speech bubble ---------- */
    .bubble-wrap {
      padding: 16px 18px 4px;
    }

    .bubble {
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 16px;
      padding: 12px 16px;
      position: relative;
      font-size: .95rem;
      line-height: 1.45;
      margin-bottom: 6px;
    }

    .bubble.alex {
      border-color: var(--sky);
    }

    .bubble.minh {
      border-color: var(--bamboo);
    }

    .bubble .who {
      font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif;
      font-weight: 700;
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .6px;
      display: block;
      margin-bottom: 3px;
    }

    .bubble.alex .who {
      color: var(--sky);
    }

    .bubble.minh .who {
      color: var(--bamboo);
    }

    .bubble::after {
      content: "";
      position: absolute;
      left: 22px;
      bottom: -11px;
      width: 0;
      height: 0;
      border: 10px solid transparent;
      border-top-color: #fff;
      filter: drop-shadow(0 2px 0 var(--ink));
    }

    /* ---------- choices ---------- */
    .choices {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 6px 18px 18px;
    }

    .choice-btn {
      text-align: left;
      background: var(--paper-dark);
      border: 3px solid var(--ink);
      border-radius: 10px;
      padding: 11px 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      font-weight: 600;
      font-size: .92rem;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform .08s ease;
      color: var(--ink);
    }

    .choice-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--ink);
    }

    .choice-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 var(--ink);
    }

    .choice-btn .tag {
      display: inline-block;
      font-size: .68rem;
      font-weight: 800;
      background: var(--ink);
      color: var(--paper);
      padding: 1px 7px;
      border-radius: 5px;
      margin-right: 8px;
      vertical-align: middle;
    }

    /* checklist style for level 2 */
    .checklist {
      padding: 6px 18px 6px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 600;
      font-size: .92rem;
    }

    .check-item input {
      width: 20px;
      height: 20px;
      accent-color: var(--bamboo);
    }

    .checklist-submit {
      margin: 10px 18px 18px;
    }

    /* countdown for level 3 */
    .countdown-wrap {
      padding: 4px 18px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .light {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--danger);
      border: 4px solid var(--ink);
      box-shadow: 0 0 0 6px #fff, 0 0 0 10px var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif;
      font-weight: 800;
      color: #fff;
      font-size: 1.6rem;
    }

    .go-stop-row {
      display: flex;
      gap: 14px;
      width: 100%;
    }

    .go-stop-row .choice-btn {
      flex: 1;
      text-align: center;
      font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif;
      font-size: 1rem;
    }

    .stop-btn {
      background: var(--danger);
      color: #fff;
    }

    .go-btn {
      background: var(--bamboo);
      color: #fff;
    }

    /* feedback */
    .feedback {
      margin: 0 18px 18px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 3px solid var(--ink);
      font-size: .9rem;
      font-weight: 600;
      display: none;
    }

    .feedback.good {
      background: #DCEEDC;
      border-color: var(--bamboo-dark);
    }

    .feedback.bad {
      background: #F6D9D9;
      border-color: var(--lacquer-dark);
    }

    .feedback .title {
      font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif;
      font-size: .95rem;
      display: block;
      margin-bottom: 4px;
    }

    .feedback.good .title {
      color: var(--bamboo-dark);
    }

    .feedback.bad .title {
      color: var(--lacquer-dark);
    }

    .next-btn {
      display: none;
      margin: 0 18px 20px;
      background: var(--lacquer);
      color: #fff;
      border: 3px solid var(--ink);
      border-radius: 10px;
      padding: 12px;
      font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: .4px;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--ink);
      width: calc(100% - 36px);
    }

    .next-btn:hover {
      transform: translate(-1px, -1px);
    }

    /* tip unlock overlay */
    .tip-overlay {
      position: fixed;
      inset: 0;
      background: rgba(36, 28, 21, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }

    .tip-card {
      background: var(--paper);
      border: 4px solid var(--ink);
      border-radius: 16px;
      box-shadow: 8px 8px 0 var(--gold);
      max-width: 420px;
      padding: 26px 24px 22px;
      text-align: center;
      animation: pop .35s ease;
    }

    @keyframes pop {
      from {
        transform: scale(.85);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .tip-card .stamp {
      font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif;
      font-weight: 800;
      color: var(--lacquer);
      font-size: .8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .tip-card .num {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--gold);
      border: 3px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      margin: 0 auto 12px;
    }

    .tip-card .tip-text {
      font-size: 1.02rem;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 18px;
    }

    .tip-card button {
      background: var(--bamboo);
      color: #fff;
      border: 3px solid var(--ink);
      border-radius: 10px;
      padding: 10px 22px;
      font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif;
      font-weight: 700;
      font-size: .95rem;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--ink);
    }

    /* start / end screens */
    .cover {
      text-align: center;
      padding: 34px 22px 26px;
    }

    .cover h1 {
      font-size: 1.7rem;
      color: var(--lacquer);
      margin: 6px 0 4px;
      line-height: 1.2;
    }

    .cover p {
      font-size: .92rem;
      line-height: 1.5;
      margin: 0 0 18px;
    }

    .cast {
      display: flex;
      justify-content: center;
      gap: 26px;
      margin: 14px 0 22px;
    }

    .cast .who {
      text-align: center;
      font-size: .78rem;
      font-weight: 700;
    }

    .cast .who span {
      display: block;
      font-size: .68rem;
      font-weight: 500;
      color: #5b5044;
    }

    .start-btn {
      background: var(--lacquer);
      color: #fff;
      border: 3px solid var(--ink);
      border-radius: 12px;
      padding: 13px 30px;
      font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif;
      font-weight: 800;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--ink);
      letter-spacing: .4px;
    }

    .start-btn:hover {
      transform: translate(-1px, -1px);
    }

    .guide-list {
      padding: 8px 22px 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .guide-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .guide-item .num {
      flex: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--gold);
      border: 2.5px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif;
      font-weight: 800;
      font-size: .9rem;
    }

    .guide-item p {
      margin: 0;
      font-size: .88rem;
      font-weight: 600;
      line-height: 1.4;
    }

    .replay-btn {
      margin: 14px 22px 22px;
      background: var(--bamboo);
      color: #fff;
      border: 3px solid var(--ink);
      border-radius: 10px;
      padding: 12px;
      font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif;
      font-weight: 700;
      width: calc(100% - 44px);
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--ink);
    }

    .hidden {
      display: none !important;
    }

    footer.note {
      text-align: center;
      font-size: .72rem;
      color: #7a6f5e;
      margin-top: 6px;
      padding: 0 10px;
    }

    /* ---------- multilingual selector ---------- */
    .language-box {
      margin: 16px auto 18px;
      max-width: 360px;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 12px;
      padding: 12px 14px;
      text-align: left;
      box-shadow: 3px 3px 0 var(--ink);
    }

    .language-box label {
      display: block;
      font-family: 'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif;
      font-weight: 800;
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 6px;
      color: var(--bamboo-dark);
    }

    .language-select {
      width: 100%;
      background: var(--paper);
      border: 2.5px solid var(--ink);
      border-radius: 8px;
      padding: 9px 10px;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      font-weight: 700;
      cursor: pointer;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-language {
      background: #fff;
      border: 2.5px solid var(--ink);
      border-radius: 8px;
      padding: 6px 8px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: .72rem;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      max-width: 130px;
    }

    .language-note {
      font-size: .72rem;
      line-height: 1.4;
      color: #6e6255;
      margin-top: 7px;
    }

    @media (max-width:520px) {
      .brand {
        font-size: .95rem;
      }

      .top-language {
        max-width: 105px;
        font-size: .66rem;
        padding: 5px 6px;
      }

      .notebook .page {
        width: 18px;
        height: 22px;
      }
    }


    /* ---------- mobile-first hardening ---------- */
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      width: 100%;
      overflow-x: hidden;
      padding: 10px 8px 32px;
    }

    button,
    select,
    label {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    select {
      min-height: 44px;
    }

    .stage {
      min-width: 0;
      max-width: 640px;
    }

    .topbar {
      gap: 6px;
      min-width: 0;
    }

    .brand {
      min-width: 0;
      flex: 1 1 auto;
    }

    .top-actions {
      min-width: 0;
      flex: 0 0 auto;
    }

    .notebook {
      flex-wrap: nowrap;
    }

    .panel,
    .scene,
    .bubble,
    .choice-btn,
    .check-item {
      max-width: 100%;
    }

    .choice-btn,
    .check-item {
      line-height: 1.35;
    }

    @media (max-width:560px) {
      body {
        padding: 6px 6px 24px;
      }

      .topbar {
        align-items: flex-start;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }

      .brand {
        width: 100%;
        flex-basis: 100%;
        font-size: 1rem;
      }

      .top-actions {
        width: 100%;
        justify-content: space-between;
      }

      .top-language {
        flex: 1 1 auto;
        max-width: none;
        width: auto;
        min-height: 38px;
      }

      .notebook {
        flex: 0 0 auto;
      }

      .notebook .page {
        width: 18px;
        height: 22px;
      }

      .panel {
        border-width: 3px;
        box-shadow: 4px 4px 0 var(--ink);
        margin-bottom: 14px;
      }

      .panel-header {
        padding: 8px 10px;
        gap: 8px;
        font-size: .75rem;
      }

      .scene {
        height: 170px;
      }

      .bubble-wrap {
        padding: 12px 12px 3px;
      }

      .bubble {
        font-size: .9rem;
        padding: 11px 12px;
      }

      .choices {
        padding: 6px 12px 14px;
      }

      .choice-btn {
        padding: 12px;
        font-size: .9rem;
      }

      .checklist {
        padding: 6px 12px;
      }

      .checklist-submit {
        margin: 10px 12px 16px;
        width: calc(100% - 24px);
      }

      .feedback {
        margin: 0 12px 14px;
      }

      .next-btn {
        margin: 0 12px 16px;
        width: calc(100% - 24px);
      }

      .countdown-wrap {
        padding: 4px 12px 16px;
      }

      .go-stop-row {
        gap: 8px;
      }

      .cover {
        padding: 24px 14px 20px;
      }

      .cover h1 {
        font-size: 1.55rem;
      }

      .cast {
        gap: 18px;
      }

      .language-box {
        margin: 14px 0 16px;
        max-width: none;
      }

      .guide-list {
        padding: 8px 12px 4px;
      }

      .replay-btn {
        margin: 14px 12px 18px;
        width: calc(100% - 24px);
      }

      .tip-overlay {
        padding: 12px;
      }

      .tip-card {
        width: 100%;
        max-width: 390px;
        padding: 20px 16px 18px;
        max-height: 90vh;
        overflow: auto;
      }
    }

    @media (max-width:360px) {
      .top-actions {
        gap: 5px;
      }

      .notebook {
        gap: 3px;
      }

      .notebook .page {
        width: 16px;
        height: 20px;
      }

      .panel-header {
        font-size: .68rem;
      }

      .scene {
        height: 155px;
      }

      .go-stop-row {
        flex-direction: column;
      }

      .cover h1 {
        font-size: 1.42rem;
      }
    }


    /* ---------- background music ---------- */
    .music-btn {
      width: 40px;
      min-width: 40px;
      height: 38px;
      min-height: 38px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2.5px solid var(--ink);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--ink);
    }

    .music-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .music-btn.music-error {
      background: #F6D9D9;
    }
  </style>
</head>

<body>

  <audio id="bg-music" preload="auto" loop playsinline>
    <source src="assets/welcome_to_vietnam.mp3" type="audio/mpeg">
  </audio>

  <div class="stage">

    <div class="topbar">
      <div class="brand"><span class="flag">🇻🇳</span> <span id="brand-text">Alex in Vietnam</span></div>
      <div class="top-actions">
        <select class="top-language" id="top-language" onchange="changeLanguage(this.value)" aria-label="Language">
          <option value="en">English</option>
          <option value="vi">Tiếng Việt</option>
          <option value="ko">한국어</option>
          <option value="ja">日本語</option>
          <option value="zh">中文</option>
          <option value="fr">Français</option>
        </select>
        <button class="music-btn" id="music-btn" onclick="toggleMusic()" aria-label="Toggle background music"
          title="Background music">🔊</button>
        <div class="notebook" id="notebook">
          <div class="page" data-i="1"></div>
          <div class="page" data-i="2"></div>
          <div class="page" data-i="3"></div>
          <div class="page" data-i="4"></div>
          <div class="page" data-i="5"></div>
        </div>
      </div>
    </div>

    <!-- ================= COVER ================= -->
    <div class="panel" id="screen-cover">
      <div class="cover">
        <h1 id="cover-title">Alex's Vietnam<br>Traffic Survival Guide</h1>
        <p id="cover-desc"></p>

        <div class="cast">
          <div class="who">🧑‍🦱 Alex<span id="cast-alex"></span></div>
          <div class="who">🧑🏻 Minh<span id="cast-minh"></span></div>
        </div>

        <div class="language-box">
          <label id="language-label" for="cover-language"></label>
          <select class="language-select" id="cover-language" onchange="changeLanguage(this.value)">
            <option value="en">🇬🇧 English</option>
            <option value="vi">🇻🇳 Tiếng Việt</option>
            <option value="ko">🇰🇷 한국어</option>
            <option value="ja">🇯🇵 日本語</option>
            <option value="zh">🇨🇳 中文</option>
            <option value="fr">🇫🇷 Français</option>
          </select>
          <div class="language-note" id="language-note"></div>
          <div class="language-note" id="mobile-demo-note">For the best mobile demo, open this game in Safari/Chrome
            from a web link rather than a file preview.</div>
        </div>

        <button class="start-btn" id="start-btn" onclick="startGame()"></button>
      </div>

          dialogue: [{ who: "alex", text: "Minh, comment suis-je censé traverser CETTE rue ?!" }, { who: "minh", text: "Ne cours pas entre les véhicules. Cherche un passage piéton, une passerelle, un passage souterrain ou un feu, puis suis le signal." }],
          type: "choice",
          options: [
            { text: "Courir entre les motos dès qu'il y a un espace", tag: "A", correct: false, fb: "Très risqué. Les mouvements des véhicules peuvent être imprévisibles et les conducteurs ont peu de temps pour réagir." },
            { text: "Se placer sur la route et faire signe aux motos de s'arrêter", tag: "B", correct: false, fb: "Un geste de la main ne garantit pas que les véhicules puissent s'arrêter en sécurité." },
            { text: "Chercher le passage piéton / feu / aménagement piéton le plus proche et suivre le signal", tag: "C", correct: true, fb: "Correct. Utilisez les aménagements pour piétons lorsqu'ils sont disponibles et respectez les signaux." }
          ],
          tip: "Trouvez un passage adapté et respectez les feux de circulation."
        },
        {
          title: "Louer une moto", scene: 2,
          dialogue: [{ who: "alex", text: "Location de moto — 150 000 VND/jour. J'ai mon permis national. Puis-je conduire ?" }, { who: "minh", text: "Avant de louer, vérifions si tes documents sont valables pour conduire au Vietnam." }],
          type: "checklist",
          checkItems: [{ id: "nat", label: "🪪 Permis de conduire national" }, { id: "idp", label: "🪪 Permis de conduire international valable au Vietnam" }, { id: "class", label: "🏍️ La catégorie du permis correspond à la moto louée" }],
          checklistCorrect: ["nat", "idp", "class"],
          fbGood: "Bien. Avant de conduire, vérifiez les documents requis et la catégorie de véhicule autorisée.",
          fbBad: "Pas encore suffisant. Vérifiez tous les documents nécessaires et la catégorie autorisée.",
          tip: "Vérifiez que votre permis est légalement valable avant de louer une moto."
        },
        {
          title: "Carrefour vietnamien", scene: 3,
          dialogue: [{ who: "minh", text: "🔴 Le feu est rouge, mais la route semble presque vide…" }, { who: "alex", text: "Cette personne est passée. Je la suis ?" }],
          type: "countdown", correctChoice: "STOP",
          fbGood: "Correct. Rouge signifie arrêt, même si la route semble vide et que d'autres personnes passent.",
          fbBad: "Passer au rouge est dangereux et peut constituer une infraction.",
          tip: "Rouge signifie arrêt — même si la route semble vide."
        },
        {
          title: "Bière au dîner", scene: 4,
          dialogue: [{ who: "alex", text: "🍜🍢🍺 ... L'hôtel est juste à côté, non ?" }, { who: "minh", text: "Si tu as bu, ne conduis pas, même pour une courte distance." }],
          type: "choice",
          options: [
            { text: "🛵 Revenir à l'hôtel en moto", tag: "A", correct: false, fb: "Ce n'est pas sûr. Après avoir bu de l'alcool, ne conduisez pas vous-même." },
            { text: "🚕 Réserver une voiture ou utiliser un autre moyen de transport sûr", tag: "B", correct: true, fb: "Bon choix. Alex peut rentrer sans conduire après avoir bu." },
            { text: "🚶 Marcher si l'hôtel est proche", tag: "C", correct: false, fb: "Cela peut convenir uniquement si l'itinéraire est réellement sûr et adapté à la marche." }
          ],
          tip: "Si vous buvez, ne conduisez pas."
        },
        {
          title: "Moto-taxi / Passager", scene: 5,
          dialogue: [{ who: "minh", text: "Le conducteur du moto-taxi donne un casque à Alex." }, { who: "alex", text: "Je ne suis que passager. J'en ai vraiment besoin ?" }],
          type: "choice",
          options: [
            { text: "Non, je suis seulement assis derrière", tag: "A", correct: false, fb: "Incorrect. Les passagers doivent également porter un casque." },
            { text: "Oui. Mettre le casque et attacher correctement la jugulaire", tag: "B", correct: true, fb: "Correct. Un passager de moto doit aussi porter correctement un casque." }
          ],
          tip: "Passager ? Casque obligatoire."
        }
      ]
    };


    let currentLang = 'en';
    let currentLevel = 0;
    let unlocked = [];
    const $ = id => document.getElementById(id);

    function applyStaticLanguage() {
      const u = UI[currentLang];
      document.documentElement.lang = currentLang;
      $('brand-text').textContent = u.brand;
      $('cover-desc').textContent = u.coverDesc;
      $('cast-alex').textContent = u.castAlex;
      $('cast-minh').textContent = u.castMinh;
      $('language-label').textContent = u.languageLabel;
      $('language-note').textContent = u.languageNote;
      $('mobile-demo-note').textContent = u.mobileDemo || '';
      $('start-btn').textContent = u.start;
      $('lv-next').textContent = u.next;
      $('final-reward').textContent = u.finalReward;
      $('final-desc').textContent = u.finalDesc;
      $('replay-btn').textContent = u.replay;
      $('footer-note').textContent = u.footer;
      $('tip-stamp').textContent = u.tipStamp;
      $('tip-close-btn').textContent = u.tipClose;
      $('top-language').value = currentLang;
      $('cover-language').value = currentLang;
    }

    function changeLanguage(lang) {
      if (!LEVELS[lang]) return;
      currentLang = lang;

      const bgMusic = getMusic();
      if (bgMusic) {
        bgMusic.volume = 0.25;
        bgMusic.addEventListener('play', updateMusicButton);
        bgMusic.addEventListener('pause', updateMusicButton);
        bgMusic.addEventListener('error', () => {
          const btn = $('music-btn');
          if (btn) {
            btn.classList.add('music-error');
            btn.textContent = '⚠️';
            btn.title = 'Music file not found: assets/welcome_to_vietnam.mp3';
          }
        });
      }
      updateMusicButton();

      applyStaticLanguage();

      if (!$('screen-level').classList.contains('hidden')) {
        renderLevel();
      }
      if (!$('screen-end').classList.contains('hidden')) {
        showEnd();
      }
    }


    let musicWanted = true;

    function getMusic() {
      return $('bg-music');
    }

    function updateMusicButton() {
      const btn = $('music-btn');
      const music = getMusic();
      if (!btn || !music) return;

      if (btn.classList.contains('music-error')) {
        btn.textContent = '⚠️';
        return;
      }

      btn.textContent = (!music.paused && musicWanted) ? '🔊' : '🔇';
    }

    async function startBackgroundMusic() {
      const music = getMusic();
      if (!music || !musicWanted) return;

      music.volume = 0.25;

      try {
        await music.play();
        $('music-btn').classList.remove('music-error');
        $('music-btn').title = 'Background music: Welcome to Vietnam';
      } catch (err) {
        // Game continues normally if the MP3 is missing or playback is blocked.
        updateMusicButton();
      }
      updateMusicButton();
    }

    async function toggleMusic() {
      const music = getMusic();
      if (!music) return;

      if (!music.paused) {
        musicWanted = false;
        music.pause();
        updateMusicButton();
        return;
      }

      musicWanted = true;
      await startBackgroundMusic();
    }


    function startGame() {
      startBackgroundMusic();
      $('screen-cover').classList.add('hidden');
      currentLevel = 0;
      unlocked = [];
      updateNotebook();
      renderLevel();
    }

    function restartGame() {
      $('screen-end').classList.add('hidden');
      $('screen-level').classList.add('hidden');
      currentLevel = 0;
      unlocked = [];
      updateNotebook();
      $('screen-cover').classList.remove('hidden');
    }

    function updateNotebook() {
      document.querySelectorAll('#notebook .page').forEach(p => {
        const i = parseInt(p.dataset.i, 10);
        p.classList.toggle('filled', unlocked.includes(i));
      });
    }

    function renderLevel() {
      const levels = LEVELS[currentLang];
      const lv = levels[currentLevel];

      $('screen-level').classList.remove('hidden');
      $('lv-num').textContent = 'LEVEL ' + (currentLevel + 1);
      $('lv-title').textContent = lv.title;
      $('lv-progress').textContent = (currentLevel + 1) + ' / ' + levels.length;
      $('lv-scene').innerHTML = scenes[lv.scene];

      $('lv-dialogue').innerHTML = lv.dialogue.map(d =>
        `<div class="bubble ${d.who}"><span class="who">${d.who === 'alex' ? 'Alex' : 'Minh'}</span>${d.text}</div>`
      ).join('');

      const fb = $('lv-feedback');
      fb.style.display = 'none';
      fb.className = 'feedback';
      $('lv-next').style.display = 'none';
      $('lv-next').textContent = UI[currentLang].next;

      const box = $('lv-interactive');
      box.innerHTML = '';

      if (lv.type === 'choice') {
        const wrap = document.createElement('div');
        wrap.className = 'choices';
        lv.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.innerHTML = `<span class="tag">${opt.tag}</span>${opt.text}`;
          btn.onclick = () => handleChoiceResult(opt.correct, opt.fb, wrap);
          wrap.appendChild(btn);
        });
        box.appendChild(wrap);
      }

      if (lv.type === 'checklist') {
        const wrap = document.createElement('div');
        wrap.className = 'checklist';
        lv.checkItems.forEach(item => {
          const label = document.createElement('label');
          label.className = 'check-item';
          label.innerHTML = `<input type="checkbox" value="${item.id}"> ${item.label}`;
          wrap.appendChild(label);
        });
        box.appendChild(wrap);

        const submit = document.createElement('button');
        submit.className = 'choice-btn checklist-submit';
        submit.style.textAlign = 'center';
        submit.style.fontFamily = "'Baloo 2'";
        submit.textContent = UI[currentLang].confirm;
        submit.onclick = () => {
          const checked = Array.from(wrap.querySelectorAll('input:checked')).map(i => i.value);
          const correct = lv.checklistCorrect.every(c => checked.includes(c)) &&
            checked.length === lv.checklistCorrect.length;
          wrap.querySelectorAll('input').forEach(i => i.disabled = true);
          submit.disabled = true;
          submit.style.opacity = .5;
          handleChoiceResult(correct, correct ? lv.fbGood : lv.fbBad, wrap);
        };
        box.appendChild(submit);
      }

      if (lv.type === 'countdown') {
        const wrap = document.createElement('div');
        wrap.className = 'countdown-wrap';
        wrap.innerHTML = `
      <div class="light" id="cd-light">3</div>
      <div class="go-stop-row">
        <button class="choice-btn stop-btn" id="cd-stop">${UI[currentLang].stop}</button>
        <button class="choice-btn go-btn" id="cd-go">${UI[currentLang].go}</button>
      </div>`;
        box.appendChild(wrap);

        let n = 3;
        const lightEl = wrap.querySelector('#cd-light');
        const timer = setInterval(() => {
          n--;
          if (n <= 0) { clearInterval(timer); lightEl.textContent = '!'; }
          else lightEl.textContent = n;
        }, 700);

        wrap.querySelector('#cd-stop').onclick = () => {
          clearInterval(timer);
          handleChoiceResult(lv.correctChoice === 'STOP', lv.correctChoice === 'STOP' ? lv.fbGood : lv.fbBad, wrap);
        };
        wrap.querySelector('#cd-go').onclick = () => {
          clearInterval(timer);
          handleChoiceResult(lv.correctChoice === 'GO', lv.correctChoice === 'GO' ? lv.fbGood : lv.fbBad, wrap);
        };
      }
    }

    function handleChoiceResult(correct, text, wrap) {
      const fb = $('lv-feedback');
      fb.style.display = 'block';
      fb.className = 'feedback ' + (correct ? 'good' : 'bad');
      $('fb-title').textContent = correct ? UI[currentLang].safe : UI[currentLang].risk;

      if (correct) {
        // Correct answer: lock the interaction and allow progression.
        wrap.querySelectorAll('button,.check-item').forEach(b => b.style.pointerEvents = 'none');
        $('fb-text').textContent = text;
        $('lv-next').textContent = UI[currentLang].next;
        $('lv-next').style.display = 'block';
        $('lv-next').onclick = onLevelComplete;
      } else {
        // Wrong answer: show warning and DO NOT allow the user to pass the level.
        $('fb-text').textContent = text + ' ' + UI[currentLang].blocked;
        $('lv-next').textContent = UI[currentLang].retry;
        $('lv-next').style.display = 'block';
        $('lv-next').onclick = () => renderLevel();
      }
    }

    function onLevelComplete() {
      const levels = LEVELS[currentLang];
      const lv = levels[currentLevel];
      const num = currentLevel + 1;
      if (!unlocked.includes(num)) unlocked.push(num);
      updateNotebook();
      showTip(num, lv.tip);
    }

    function showTip(num, text) {
      $('tip-num').textContent = num;
      $('tip-text').textContent = text;
      $('tip-overlay').style.display = 'flex';
    }

    function closeTip() {
      $('tip-overlay').style.display = 'none';
      currentLevel++;
      if (currentLevel < LEVELS[currentLang].length) {
        renderLevel();
      } else {
        $('screen-level').classList.add('hidden');
        showEnd();
      }
    }

    function showEnd() {
      const levels = LEVELS[currentLang];
      $('guide-list').innerHTML = levels.map((lv, i) =>
        `<div class="guide-item"><div class="num">${i + 1}</div><p>${lv.tip}</p></div>`
      ).join('');
      $('screen-end').classList.remove('hidden');
    }

    applyStaticLanguage();
  </script>
</body>
